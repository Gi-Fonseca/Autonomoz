<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Autonomoz | Movimentações de Estoque</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="src/css/style.css" />
  </head>
  <body class="bg-light">
    <div class="d-flex min-vh-100">
      <aside
        class="bg-white border-end p-3 d-flex flex-column justify-content-between"
        style="width: 260px; min-width: 260px; flex-shrink: 0"
      >
        <div>
          <div class="d-flex align-items-center gap-2 mb-4 px-2">
            <i class="bi bi-car-front-fill text-danger-custom fs-3"></i>
            <div>
              <div
                class="fw-black text-danger-custom lh-1 fs-5"
                style="font-weight: 800"
              >
                AutoNoMoz
              </div>
              <div
                class="text-muted fw-bold"
                style="font-size: 0.65rem; letter-spacing: 1px"
              >
                GESTÃO DE FROTA
              </div>
            </div>
          </div>
          <ul class="nav nav-pills flex-column gap-1">
            <li class="nav-item">
              <a
                data-menu-page="index.html"
                href="index.html"
                class="nav-link rounded-3 px-3 py-2"
                ><i class="bi bi-grid-1x2 me-2"></i> Painel</a
              >
            </li>
            <li class="nav-item">
              <a
                data-menu-page="inventario.html"
                href="inventario.html"
                class="nav-link rounded-3 px-3 py-2"
                ><i class="bi bi-box-seam me-2"></i> Inventário</a
              >
            </li>
            <li class="nav-item">
              <a
                data-menu-page="movimentacoes.html"
                href="movimentacoes.html"
                class="nav-link rounded-3 px-3 py-2"
                ><i class="bi bi-arrow-down-up me-2"></i> Movimentações</a
              >
            </li>
            <li class="nav-item">
              <a
                data-menu-page="fornecedores.html"
                href="fornecedores.html"
                class="nav-link rounded-3 px-3 py-2"
                ><i class="bi bi-truck me-2"></i> Fornecedores</a
              >
            </li>
            <li class="nav-item">
              <a
                data-menu-page="produto-cadas.html"
                href="produto-cadas.html"
                class="nav-link rounded-3 px-3 py-2"
                ><i class="bi bi-plus-circle me-2"></i> Cadastrar item</a
              >
            </li>
            <li class="nav-item">
              <a
                data-menu-page="gerencia.html"
                href="gerencia.html"
                class="nav-link rounded-3 px-3 py-2"
                ><i class="bi bi-shield-lock me-2"></i> Gerência</a
              >
            </li>
          </ul>
        </div>
        <div class="border-top pt-3">
          <button
            class="btn btn-link nav-link small text-danger p-0 px-2"
            onclick="fazerLogout()"
          >
            <i class="bi bi-box-arrow-right me-2"></i> Sair do Sistema
          </button>
        </div>
      </aside>
      <main class="flex-grow-1 p-4 overflow-auto">
        <div class="d-flex justify-content-between align-items-center mb-1">
          <h3 class="fw-bold mb-0">Histórico de movimentações</h3>
          <button
            class="btn btn-outline-danger btn-sm"
            onclick="carregarHistorico()"
          >
            Atualizar
          </button>
        </div>
        <p class="text-muted small mb-4">
          Entradas, saídas e ajustes registrados no estoque.
        </p>
        <div id="mensagem-historico" class="alert d-none"></div>
        <div class="card border-0 shadow-sm rounded-3 overflow-hidden">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-light">
                <tr class="small text-muted fw-bold">
                  <th class="ps-3">DATA</th>
                  <th>PRODUTO</th>
                  <th>TIPO</th>
                  <th>QTD</th>
                  <th>RESPONSÁVEL</th>
                  <th>MOTIVO</th>
                </tr>
              </thead>
              <tbody id="tabela-movimentacoes">
                <tr>
                  <td colspan="6" class="text-center py-4">Carregando...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="src/js/config.js"></script>
    <script src="src/js/movimentacoes.js"></script>
    <script src="src/js/menu.js"></script>
  </body>
</html>
