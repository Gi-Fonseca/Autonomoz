    <link rel="stylesheet" href="src/css/style.css">
</head>
<body class="bg-light">

<div class="d-flex min-vh-100">
    <!-- SIDEBAR UNIFICADA -->
    <aside class="bg-white border-end p-3 d-flex flex-column justify-content-between" style="width: 260px; min-width: 260px; flex-shrink: 0;">
        <div>
            <div class="d-flex align-items-center gap-2 mb-4 px-2">
                <i class="bi bi-car-front-fill text-danger-custom fs-3"></i>
                <div>
                    <div class="fw-black text-danger-custom lh-1 fs-5" style="font-weight: 800;">AutoNoMoz</div>
                    <div class="text-muted fw-bold" style="font-size: 0.65rem; letter-spacing: 1px;">GESTÃO DE FROTA</div>
                </div>
            </div>

            <ul class="nav nav-pills flex-column gap-1">
  <li class="nav-item"><a data-menu-page="index.html" href="index.html" class="nav-link rounded-3 px-3 py-2"><i class="bi bi-grid-1x2 me-2"></i> Painel</a></li>

  <li class="nav-item"><a data-menu-page="movimentacoes.html" href="movimentacoes.html" class="nav-link rounded-3 px-3 py-2"><i class="bi bi-arrow-down-up me-2"></i> Movimentações</a></li>
  <li class="nav-item"><a data-menu-page="fornecedores.html" href="fornecedores.html" class="nav-link rounded-3 px-3 py-2"><i class="bi bi-truck me-2"></i> Fornecedores</a></li>
  <li class="nav-item"><a data-menu-page="produto-cadas.html" href="produto-cadas.html" class="nav-link rounded-3 px-3 py-2"><i class="bi bi-plus-circle me-2"></i> Cadastrar item</a></li>
  <li class="nav-item"><a data-menu-page="gerencia.html" href="gerencia.html" class="nav-link rounded-3 px-3 py-2"><i class="bi bi-shield-lock me-2"></i> Gerência</a></li>
</ul>
        </div>

        <div class="border-top pt-3">
            <button class="btn btn-link nav-link small text-danger p-0 px-2" onclick="fazerLogout()"><i class="bi bi-box-arrow-right me-2"></i> Sair do Sistema</button>
        </div>
    </aside>

    <main class="flex-grow-1 p-4 overflow-auto">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold m-0">Fornecedores Cadastrados</h3>
                <p class="text-muted small m-0">Gestão de parceiros e fornecedores de componentes.</p>
            </div>
            <button class="btn btn-danger fw-bold rounded-3" data-bs-toggle="modal" data-bs-target="#modalFornecedor"><i class="bi bi-plus-lg me-1"></i> Cadastrar Fornecedor</button>
        </div>

        <div class="card border-0 shadow-sm rounded-3 overflow-hidden">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr class="small text-muted fw-bold">
                            <th class="ps-3">CNPJ</th>
                            <th>RAZÃO SOCIAL</th>
                            <th>TELEFONE</th>
                            <th>EMAIL</th>
                            <th class="text-end pe-3">AÇÕES</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-fornecedores"><tr><td colspan="5" class="text-center py-4 text-muted">Carregando fornecedores...</td></tr></tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<div class="modal fade" id="modalFornecedor" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><form id="form-fornecedor"><div class="modal-header"><h5 class="modal-title fw-bold">Cadastrar fornecedor</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><div id="mensagem-fornecedor" class="alert d-none"></div><div class="mb-3"><label class="form-label">Razão social / Nome</label><input id="fornecedor-nome" class="form-control" required></div><div class="mb-3"><label class="form-label">CNPJ</label><input id="fornecedor-cnpj" class="form-control" inputmode="numeric" maxlength="18" required></div><div class="mb-3"><label class="form-label">Telefone</label><input id="fornecedor-telefone" class="form-control" inputmode="tel" maxlength="15" required></div><div class="mb-3"><label class="form-label">E-mail</label><input id="fornecedor-email" type="email" class="form-control" required></div></div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button><button type="submit" class="btn btn-danger">Salvar fornecedor</button></div></form></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
